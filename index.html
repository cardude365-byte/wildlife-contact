    .home-service{left:83.0%;top:78.4%;width:14.0%;height:20.4%}

    .quick-menu{
      position:absolute;
      z-index:8;
      top:8.8%;
      right:2.7%;
      width:260px;
      padding:14px;
      border:1px solid #334654;
      border-radius:16px;
      background:rgba(5,12,18,.97);
      box-shadow:0 20px 48px rgba(0,0,0,.42);
      line-height:1.2;
      display:none;
    }
    .quick-menu.open{display:block}
    .quick-menu a{
      display:block;

</head>
<body>
  <main class="hero" aria-label="Wildlife Ops LLC home page">
    <div class="hero-inner">
      <img src="wildlife-ops-hero.png" alt="Wildlife Ops LLC nuisance wildlife control services in Ohio" />

      <a class="hotspot logo-home" href="index.html" aria-label="Wildlife Ops home"><span class="sr-only">Wildlife Ops Home</span></a>

      <a class="hotspot call-top" href="tel:+13305659322" aria-label="Call Wildlife Ops at 330-565-9322"><span class="sr-only">Call 330-565-9322</span></a>
      <button class="hotspot menu-toggle" id="menuToggle" type="button" aria-label="Open navigation menu" aria-expanded="false"></button>

      <a class="hotspot call-main" href="tel:+13305659322" aria-label="Call Wildlife Ops at 330-565-9322"><span class="sr-only">Call or text 330-565-9322</span></a>

      <nav class="quick-menu" id="quickMenu" aria-label="Quick navigation">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="service-area.html">Service Area</a>

        <a class="menu-call" href="tel:+13305659322">Call 330-565-9322</a>
      </nav>
    </div>
  </main>
  <script>
    (function(){
      const toggle = document.getElementById('menuToggle');
      const menu = document.getElementById('quickMenu');
      if(!toggle || !menu) return;
      toggle.addEventListener('click', function(e){
        e.stopPropagation();
        const open = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function(e){
        if(!menu.contains(e.target) && e.target !== toggle){
          menu.classList.remove('open');
          toggle.setAttribute('aria-expanded','false');
        }
      });
    })();
  </script>
</body>
